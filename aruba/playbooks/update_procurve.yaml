---
# Update firmware on old Aruba OS (Procurve) switches.
#
# To run the playbook:
# ansible-playbook update_procurve.yaml
#
# Required inventory variables for [procurve:vars] are defined in hosts.ini:
#   tftp_server: IP address of TFTP server
#   firmware_version: Version string (e.g., "WC_16_11_0030")
#
- name: "Update firmware on Procurve/ArubaOS switches"
  hosts: procurve
  gather_facts: false
  serial: 20

  tasks: 
    - name: Set firmware string to update
      ansible.builtin.set_fact:
        firmware_to_update: "{{ firmware_version | replace('_', '.') }}"

    - name: Get run version
      ansible.netcommon.cli_command:
        command: "show version"
      register: version

    - name: Upgrade devices
      block:
        - name: Save running configuration to startup configuration
          ansible.netcommon.cli_command:
            command: "write memory"

        - name: Check flash images
          ansible.netcommon.cli_command:
            command: "show flash"
          register: flash_info

        - name: Extract Primary and Secondary versions
          ansible.builtin.set_fact:
            primary_ver: "{{ flash_info.stdout | regex_search('Primary Image\\s*:\\s*\\d+\\s+\\S+\\s+(\\S+)', '\\1') | first }}"
            secondary_ver: "{{ flash_info.stdout | regex_search('Secondary Image\\s*:\\s*\\d+\\s+\\S+\\s+(\\S+)', '\\1') | first }}"

        - name: Sync Primary image to Secondary slot
          when: primary_ver != secondary_ver
          block:
          - name: Copy Primary image to Secondary
            ansible.netcommon.cli_command:
              command: "copy flash flash secondary"
            register: copy_primary
            until: copy_primary is succeeded
            retries: 3
            delay: 10

          - name: Wait until the secondary has the old primary image
            ansible.netcommon.cli_command:
              command: show flash
            register: flash_result
            until: "'Secondary' in flash_result.stdout and 'Primary' in flash_result.stdout"
            retries: 12
            delay: 10

        - name: Download and stage new firmware to Primary slot
          when: primary_ver != firmware_to_update
          block:
          - name: Temporarily permit TFTP traffic
            ansible.netcommon.cli_command:
              command: |
                config
                tftp client

          - name: Download new firmware from TFTP server
            ansible.netcommon.cli_command:
              command: "copy tftp flash {{ tftp_server }} software/{{ firmware }} primary"
              prompt: "[Cc]ontinue"
              answer: "y"
            vars: 
              ansible_command_timeout: 300
            register: tftp_output

          - name: Debug TFTP Output
            ansible.builtin.debug:
              var: tftp_output.stdout_lines

          - name: Remove temporary TFTP permit
            ansible.netcommon.cli_command:
              command: |
                config
                ip ssh filetransfer
      when: 
        - firmware_to_update not in version.stdout
        - inventory_hostname in groups['procurve']


