---
# Reboot Aruba Switches
#
# To run the playbook:
#   ansible-playbook reboot_procurve.yaml -l <HOSTS>
#
- name: Reboot Procurve/ArubaOS switches
  hosts: "{{ target_hosts | default('procurve') }}"
  gather_facts: false
  serial: 20
  vars:
    ansible_command_timeout: 120

  tasks:
    - name: Get version
      ansible.netcommon.cli_command:
        command: "show version"
      register: version

    - name: Register flash stdout 
      ansible.netcommon.cli_command:
        command: "show flash"
      register: device_images

    # ---------------------------------------------------------
    # ARUBA PARSING LOGIC
    # ---------------------------------------------------------
    - name: Isolate the Primary Image line
      ansible.builtin.set_fact:
        # Searches all lines and grabs the first one containing 'Primary Image   :'
        primary_image_line: "{{ device_images.stdout_lines | select('search', 'Primary Image\\s*:') | first }}"

    - name: Extract exact firmware version string
      ansible.builtin.set_fact:
        # Splits the line by whitespace and grabs the very last item (e.g., KB.16.11.0003)
        primary_firmware_version: "{{ primary_image_line.split()[-1] }}"

    - name: Verify extracted values (Optional)
      ansible.builtin.debug:
        msg: 
          - "Isolated Line: {{ primary_image_line }}"
          - "Extracted Version: {{ primary_firmware_version }}"

    # ---------------------------------------------------------
    # CONDITIONAL CHECK / REBOOT LOGIC
    # ---------------------------------------------------------
    - name: Reboot device to Primary Flash if running version doesn't match
      block:
        - name: Save running configuration to startup configuration
          ansible.netcommon.cli_command:
            command: "write memory"

        - name: Reboot the switch to apply firmware
          ansible.netcommon.cli_command:
            command: "boot system flash primary"
            prompt:
              - "[Cc]ontinue"
              - "Do you want to save the current configuration"
            answer:
              - "y"
              - "n"
          ignore_errors: true

        - name: Wait for switch to reconnect
          ansible.builtin.wait_for_connection:
            delay: 30
            timeout: 300

      when: primary_firmware_version not in version.stdout