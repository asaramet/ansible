---
- name: Debugging
  hosts: cisco
  gather_facts: false
  #serial: 1
  tasks:

#    - name: Show hosts variables
#      ansible.builtin.debug:
#        var: "{{ hostvars[inventory_hostname] }}"

    - name: Get version
      ansible.netcommon.cli_command:
        command: "show version"
      register: version

    - name: Show version
      ansible.builtin.debug:
        var: version.stdout_lines
      
    - name: Show firmware to be installed
      ansible.builtin.debug:
        var: firmware


    - name: Execute 9500 ISSU Commands
      block:
        - name: Show upgrade command
          ansible.builtin.debug:
            msg: "install add file {{ filesystem }}:{{ firmware }} activate issu commit"
      when: 
        - inventory_hostname in groups['catalyst_9500']
        # Only run this block if the switch is in Install Mode
        - "'packages.conf' in version.stdout"

    - name: Execute 9500 Upgrade and Convert to Install Mode
      block:
        - name: Show upgrade and convert command
          ansible.builtin.debug:
            msg: "install add file {{ filesystem }}:{{ firmware }} activate commit"
      when: 
        - inventory_hostname in groups['catalyst_9500']
        # Only run this block if the switch is in Install Mode
        - "'packages.conf' not in version.stdout"
